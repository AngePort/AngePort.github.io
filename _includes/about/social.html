{% assign url_lower = include.url | downcase %}
<a href="{{ include.url }}"{% unless url_lower contains 'mailto:' %} target="_blank" rel="noopener"{% endunless %}>
  <svg class="tf-social">
    <use xlink:href="{{ '/img/bootstrap-icons.svg' | prepend: site.baseurl }}#{{- include.name -}}"/>
  </svg>
  <span>{{ include.label }}</span>
</a>
