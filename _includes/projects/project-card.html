<article class="tf-project-card">
  <div class="tf-project-card-media" style="background-image: url('{{ site.baseurl }}/{{ include.page.image }}');">
    <span class="tf-project-card-date">{{ include.page.date }}</span>
  </div>
  <div class="tf-project-card-body">
    <h3>{{ include.page.title }}</h3>
    <p class="tf-project-card-summary">{{ include.page.summary }}</p>
    <div class="tf-project-card-tags">
      {% for label in include.page.labels %}
        <span>{{ label }}</span>
      {% endfor %}
    </div>
  </div>
  <div class="tf-project-card-footer">
    {% if include.page.projecturl %}
      <a href="{{ include.page.projecturl }}" class="tf-btn-ghost tf-btn-ghost-dark" target="_blank" rel="noopener">Project Site</a>
    {% else %}
      <a href="{{ site.baseurl }}{{ include.page.url }}" class="tf-btn-ghost tf-btn-ghost-dark">Read Case Study</a>
    {% endif %}
    <a href="{{ site.baseurl }}{{ include.page.url }}" class="tf-btn-link">Details →</a>
  </div>
</article>
