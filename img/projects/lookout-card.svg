  <rect x="640" y="500" width="520" height="6" fill="url(#lookout-accent)" rx="3" />
  <text x="640" y="580" fill="#cfe8ff" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="36">Maps + Ticketmaster + TypeScript stack</text>
  <text x="640" y="640" fill="#9ec7ff" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30">Geolocation · Smart Filters · Render/Vercel</text>
