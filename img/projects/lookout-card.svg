      <stop offset="0%" stop-color="#0b1f34" />
      <stop offset="100%" stop-color="#1e4b7a" />
    </linearGradient>
    <linearGradient id="lookout-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#72efdd" />
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#lookout-bg)" rx="40" />
  <g transform="translate(200, 260)">
    <circle cx="220" cy="180" r="160" fill="rgba(17, 40, 73, 0.85)" stroke="#58a6ff" stroke-width="8" />
    <path d="M220 70 L280 210 L160 210 Z" fill="#58a6ff" opacity="0.8" />
