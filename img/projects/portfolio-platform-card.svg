    <circle cx="320" cy="260" r="60" fill="none" stroke="#ec4899" stroke-width="6" />
    <path d="M320 230 L340 260 L300 260 Z" fill="#ec4899" />
  </g>
  <text x="640" y="360" fill="#c4b5fd" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="42" letter-spacing="6">TECHFOLIO PLATFORM</text>
  <text x="640" y="460" fill="#ffffff" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="92" font-weight="700">Portfolio System</text>
