<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Portfolio Platform cover">
  <defs>
    <linearGradient id="portfolio-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
    <linearGradient id="portfolio-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#portfolio-bg)" rx="40" />
  <g transform="translate(200, 230)">
    <rect x="40" y="40" width="360" height="240" rx="24" fill="rgba(255,255,255,0.04)" stroke="#8b5cf6" stroke-width="4" />
    <rect x="80" y="80" width="280" height="60" rx="12" fill="#8b5cf6" opacity="0.4" />
    <rect x="80" y="160" width="220" height="30" rx="8" fill="#ec4899" opacity="0.7" />
