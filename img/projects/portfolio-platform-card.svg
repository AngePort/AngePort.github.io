  <text x="640" y="580" fill="#f5d0fe" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="36">Jekyll · TechFolio · Agent workflows</text>
  <text x="640" y="640" fill="#c4b5fd" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30">Structured data · GitHub Pages · Ops guide</text>
