<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Morning Brew Meteor cover">
  <defs>
    <linearGradient id="brew-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b1a12" />
      <stop offset="100%" stop-color="#5a3314" />
    </linearGradient>
    <linearGradient id="brew-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdd499" />
      <stop offset="100%" stop-color="#f6ad55" />
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#brew-bg)" rx="40" />
  <g transform="translate(220, 250)">
    <rect x="100" y="120" width="240" height="180" rx="40" fill="#f6ad55" opacity="0.25" />
    <circle cx="220" cy="210" r="110" fill="none" stroke="#fdd499" stroke-width="10" />
    <path d="M160 250 C190 280 250 280 280 250" stroke="#fdd499" stroke-width="10" fill="none" stroke-linecap="round" />
    <path d="M220 140 C200 120 200 100 220 90" stroke="#f6ad55" stroke-width="8" fill="none" stroke-linecap="round" />
    <path d="M250 140 C230 120 230 100 250 90" stroke="#f6ad55" stroke-width="8" fill="none" stroke-linecap="round" />
  </g>
  <text x="640" y="360" fill="#fddfba" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="42" letter-spacing="6">MORNING BREW</text>
  <text x="640" y="460" fill="#ffffff" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="96" font-weight="700">Meteor Cafe App</text>
  <rect x="640" y="500" width="520" height="6" fill="url(#brew-accent)" rx="3" />
  <text x="640" y="580" fill="#fde7c7" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="36">Role-based menus · Favorites · Admin flows</text>
  <text x="640" y="640" fill="#fddfba" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30">Meteor · React · Semantic UI React</text>
</svg>
